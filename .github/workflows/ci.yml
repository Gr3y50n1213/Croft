name: ci

# Actions are pinned by tag for now; pinning each by commit SHA is a later hardening step.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p croft-ffi --all-targets --features cli -- -D warnings
      - run: cargo test --locked

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 core/storage/tools/check_schema.py

  # Builds the Rust FFI library for Android (cargo-ndk), generates the Kotlin bindings, builds the
  # debug APK and runs the JVM unit tests. The commands are the same ones used locally
  # (android/README.md).
  android:
    runs-on: ubuntu-latest
    env:
      CARGO_NDK_VERSION: 4.1.2
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the debug APK and run the JVM unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - name: Check 16 KB page alignment of the native libraries
        working-directory: android
        run: |
          tools/check-16kb-alignment.sh app/build/generated/rust/jniLibs
          rm -rf app/build/apk-libs && unzip -q app/build/outputs/apk/debug/app-debug.apk 'lib/*' -d app/build/apk-libs
          tools/check-16kb-alignment.sh app/build/apk-libs
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: croft-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # The unsigned release build (R8 and resource shrinking on) and its gates: the keep rules for UniFFI and JNA (Gradle,
  # during the build), the manifest allowlist, no dependency-info block, not debuggable, 16 KB alignment of the APK and
  # the AAB. Uploads nothing: signing is the owner's, outside the repository (android/README.md, "Release build").
  android-release:
    runs-on: ubuntu-latest
    env:
      CARGO_NDK_VERSION: 4.1.2
      NDK_VERSION: 29.0.14206865
      BUNDLETOOL_VERSION: 1.18.3
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the manifest check
        working-directory: android
        run: python3 -m unittest discover -s tools
      - name: Build the unsigned release APK and AAB
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Check the release outputs (unsigned, manifest allowlist, 16 KB alignment)
        working-directory: android
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          tools/check-release-outputs.sh "$RUNNER_TEMP/bundletool.jar"

  # Runs the protocol adapters against real mail servers in containers (GreenMail, Dovecot).
  integration:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: docker compose -f test-servers/docker-compose.yml up -d --wait greenmail dovecot stalwart
      - run: bash test-servers/stalwart/setup.sh
      - run: cd core && cargo test --locked -p croft-protocols --features integration
      - if: always()
        run: docker compose -f test-servers/docker-compose.yml down -v

  # The storage and FFI crates with SQLCipher (the host's OpenSSL here; the Android build compiles its own).
  sqlcipher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --locked --all-targets --features sqlcipher -p croft-storage -- -D warnings
      - run: cargo test --locked -p croft-storage --features sqlcipher
      - run: cargo test --locked -p croft-ffi --features sqlcipher

  design:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/generator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generate
      - run: npm test
      - run: git diff --exit-code -- ../generated
