# Application id and Kotlin namespace: a placeholder until the real id is chosen. This is the one
# place that sets them for the build (app/build.gradle.kts reads it for applicationId and namespace).
# The Kotlin sources and design/generated/kotlin/CroftTokens.kt carry the same package in their
# `package` lines; move them when this changes.
croft.applicationId=com.example.croft

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.nonTransitiveRClass=true
