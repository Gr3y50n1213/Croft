# The Croft Companion (phase 2): a self-hosted, multi-user server. AGPL-3.0-or-later (LICENSES.md).
# Its own workspace: it will depend on the core's crates by path from T26 on, and on their exact
# rusqlite version (two bundled SQLite builds cannot be linked into one binary).
[workspace]

[package]
name = "croft-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
publish = false
description = "The Croft Companion server"

[dependencies]
croft-protocols = { path = "../core/protocols" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22.1"
http-body-util = "0.1.3"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "server-graceful", "service"] }
qrcode = { version = "0.14.1", default-features = false }
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.29", features = ["v4"] }
webauthn-rs = { version = "0.6.2", features = ["conditional-ui"] }
zeroize = "1.9.1"

# The core's patched crates apply only inside its own workspace; the Companion names them again.
# Do not remove without reading core/vendor/async-imap/CROFT-PATCHES.md (the stock crate logs
# protocol lines, which can hold passwords). `the_core_patches_are_in_force` checks the lock file.
[patch.crates-io]
async-imap = { path = "../core/vendor/async-imap" }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["io-util"] }
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
