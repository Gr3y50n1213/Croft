# The Croft Companion (phase 2): a self-hosted, multi-user server. AGPL-3.0-or-later (LICENSES.md).
# Its own workspace: it will depend on the core's crates by path from T26 on, and on their exact
# rusqlite version (two bundled SQLite builds cannot be linked into one binary).
[workspace]

[package]
name = "croft-companion"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
publish = false
description = "The Croft Companion server"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
ring = "0.17.14"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
toml = "1.2.1"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
