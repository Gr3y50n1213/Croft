[workspace]
resolver = "2"
members = ["storage", "protocols", "mail-core", "ffi", "test-support", "engine", "reader"]
# vendor/ holds third-party source with local patches (see vendor/async-imap/CROFT-PATCHES.md). It is
# a path dependency inside the workspace folder, which Cargo would otherwise make a member, so it
# is excluded: our fmt and clippy checks must not run on code that is not ours.
exclude = ["vendor"]
# crypto/ joins the workspace when the OpenPGP work starts (rPGP); see its README file.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"

# async-imap 0.12.0 with the logging of commands and responses removed and its buffer limit lowered.
# Do not remove this patch without reading vendor/async-imap/CROFT-PATCHES.md: the stock crate logs
# the LOGIN line (with the password) at trace level.
[patch.crates-io]
async-imap = { path = "vendor/async-imap" }
# html5ever 0.40.1 with a linear-time serializer escape, no logging of message content and a work
# budget that bounds every parse. Do not remove without reading vendor/html5ever/CROFT-PATCHES.md.
html5ever = { path = "vendor/html5ever" }
# ammonia 4.2.4 with the parser's work budget charged in its DOM and filters, and no list of parse
# errors kept. Do not remove without reading vendor/ammonia/CROFT-PATCHES.md.
ammonia = { path = "vendor/ammonia" }
