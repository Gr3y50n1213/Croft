[workspace]
resolver = "2"
members = ["storage", "protocols", "mail-core", "test-support"]
# crypto/ and ffi/ join the workspace when crates.io is reachable (rPGP, UniFFI); see their README files.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
