[package]
name = "croft-ffi"
description = "Croft FFI: the small, versioned UniFFI surface the apps call"
version.workspace = true
edition.workspace = true
license.workspace = true
# Same floor as croft-storage (rusqlite needs it).
rust-version = "1.89"

[lib]
# cdylib: the .so the Android app loads (and the host library the JVM tests load).
# lib: so tests and `uniffi-bindgen --library` can use the crate normally.
crate-type = ["cdylib", "lib"]

[features]
# Builds the `uniffi-bindgen` binary that generates the Kotlin (and later Swift) bindings.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
croft-storage = { path = "../storage" }
uniffi = "0.32.2"

[dev-dependencies]
croft-protocols = { path = "../protocols" }
serde_json = "1.0.154"
tempfile = "3.27"

# Lints: inherited from the workspace, including `unsafe_code = "forbid"`. UniFFI 0.32's proc macros
# (`setup_scaffolding!`, `#[uniffi::export]`, the derives) expand to code that rustc does not
# report under this lint, so no exception is needed. Checked: the crate builds with `forbid`.
# If a future UniFFI needs one, do not weaken this silently: see the task T07 notes.
[lints]
workspace = true
