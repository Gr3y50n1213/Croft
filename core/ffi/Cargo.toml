[package]
name = "croft-ffi"
description = "Croft FFI: the small, versioned UniFFI surface the apps call"
version.workspace = true
edition.workspace = true
license.workspace = true
# croft-reader's mail-parser needs Rust 1.98.
rust-version = "1.98"

[lib]
# cdylib: the .so the Android app loads (and the host library the JVM tests load).
# lib: so tests and `uniffi-bindgen --library` can use the crate normally.
crate-type = ["cdylib", "lib"]

[features]
# Builds the `uniffi-bindgen` binary that generates the Kotlin (and later Swift) bindings.
cli = ["uniffi/cli"]
# Encrypts the database file (SQLCipher), linked against the computer's OpenSSL. Without a SQLCipher
# feature `Core.open` refuses a key instead of storing mail unencrypted. Used by
# `cargo test -p croft-ffi --features sqlcipher`; the Gradle builds (Android and the host library for
# the JVM tests) use `sqlcipher-vendored-openssl`.
sqlcipher = ["croft-storage/sqlcipher"]
# SQLCipher with its own OpenSSL crypto, compiled from source (openssl-src) for the target. The
# Android build uses this one: the NDK has no OpenSSL to link against. Needs perl and make.
sqlcipher-vendored-openssl = ["sqlcipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]

# Exports `TestImapServer`, the in-process IMAP server of `core/test-support`, so that the Kotlin
# JVM tests can run the app's code against a real (local) server. TEST ONLY: never in the Android
# library (the Gradle build's `rustFeatures` must not name it, and `tools/check-release-outputs.sh`
# fails if the release `.so` holds the test symbols); only the host library the JVM tests load has it.
test-server = ["dep:croft-test-support"]

# Compose tests against real servers in containers (GreenMail): `cargo test -p croft-ffi --features
# integration compose::tests::integration`. See test-servers/docker-compose.yml. Needs the containers
# running; not part of a plain `cargo test`.
integration = []

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
croft-engine = { path = "../engine" }
croft-mail-core = { path = "../mail-core" }
croft-protocols = { path = "../protocols" }
croft-reader = { path = "../reader" }
croft-storage = { path = "../storage" }
getrandom = "0.4.3"
# T39a: the calendar's times and zones (the same bundled database as mail-core).
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
log = "0.4.29"
# Only for the keyset message query and its row type; the bundled SQLite comes from croft-storage.
rusqlite = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `Core` owns a multi-thread runtime of its own: see the crate documentation, "Async and the runtime".
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "sync", "time", "net"] }
uniffi = "0.32.2"
# Wipes the password and token strings (and the database key) after use.
zeroize = "1.9.1"
# Only with the `test-server` feature (test builds of the host library); see that feature.
croft-test-support = { path = "../test-support", optional = true }

# Only for the flag values of `open(2)` (O_NOFOLLOW, O_NONBLOCK) when a file is read for an attachment;
# no `unsafe` is used.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# `test-fakes`: recording stand-ins for DNS and HTTPS, so discovery is tested without a network.
croft-protocols = { path = "../protocols", features = ["test-fakes"] }
croft-test-support = { path = "../test-support" }
tempfile = "3.27"

# Lints: inherited from the workspace, including `unsafe_code = "forbid"`. UniFFI 0.32's proc macros
# (`setup_scaffolding!`, `#[uniffi::export]`, the derives) expand to code that rustc does not
# report under this lint, so no exception is needed. Checked: the crate builds with `forbid`.
# If a future UniFFI needs one, do not weaken this silently: see the task T07 notes.
[lints]
workspace = true
