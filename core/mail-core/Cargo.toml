[package]
name = "croft-mail-core"
description = "Croft mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
croft-protocols = { path = "../protocols" }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# T39a: time zones and dates for the calendar, with its own bundled time zone database (never the device's).
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
