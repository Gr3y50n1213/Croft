[package]
name = "croft-storage"
description = "Croft storage"
version.workspace = true
edition.workspace = true
license.workspace = true
# Higher than the workspace value (1.85) because rusqlite 0.41 needs Rust 1.89.
rust-version = "1.89"

[features]
# Encrypts the database file with SQLCipher (rusqlite's `bundled-sqlcipher`). Without it, `Db::open`
# refuses a key instead of silently storing mail unencrypted.
sqlcipher = ["rusqlite/bundled-sqlcipher", "dep:zeroize"]

[dependencies]
croft-mail-core = { path = "../mail-core" }
croft-protocols = { path = "../protocols" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
# Wipes the key text we build in `Db::open` when it is dropped (only needed, and only built, with `sqlcipher`).
zeroize = { version = "1.9.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
# The JMAP id map is also tested together with the JMAP adapter and its in-process test server.
croft-test-support = { path = "../test-support" }
tokio = { version = "1.54", features = ["macros", "rt", "time"] }

[lints]
workspace = true
