[package]
name = "croft-test-support"
description = "In-process IMAP, SMTP and JMAP test servers for Croft tests (not product code)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = "1.0.154"
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.54", features = ["net", "time", "sync", "io-util", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
