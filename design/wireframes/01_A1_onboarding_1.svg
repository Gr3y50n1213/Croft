8.0" width="252.0" height="48.0" rx="24.0" fill="none" stroke="#CBC4B5" stroke-width="1.2"/><text x="150.0" y="456.7" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#2F4A33" text-anchor="middle">I run a Companion server</text><rect x="24.0" y="484.0" width="252.0" height="40.0" rx="20.0" fill="none"/><text x="150.0" y="508.7" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#2F4A33" text-anchor="middle">Try with sample mail</text><text x="150.0" y="551.8" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6C706A" text-anchor="middle">No Croft account. Your mail goes straight to</text><text x="150.0" y="566.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6C706A" text-anchor="middle">your server.</text><text x="150.0" y="593.8" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2F4A33" text-anchor="middle">Privacy policy  ·  Open-source licences</text><text x="22.0" y="19.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#1E2220">9:41</text><rect x="214.0" y="16.4" width="3.0" height="2.6" rx="1" fill="#1E2220"/><rect x="219.0" y="13.8" width="3.0" height="5.2" rx="1" fill="#1E2220"/><rect x="224.0" y="11.2" width="3.0" height="7.8" rx="1" fill="#1E2220"/><rect x="229.0" y="8.6" width="3.0" height="10.4" rx="1" fill="#1E2220"/><rect x="244.0" y="10.0" width="24.0" height="11.0" rx="3.5" fill="none" stroke="#1E2220" stroke-width="1.2"/><rect x="246.0" y="12.0" width="15.0" height="7.0" rx="1.5" fill="#1E2220"/><rect x="268.5" y="13.5" width="2.0" height="4.0" rx="1" fill="#1E2220"/><rect x="100.0" y="610.0" width="100.0" height="4.0" rx="2" fill="#1E2220" opacity="0.55"/></g><rect width="300" height="620" rx="30" fill="none" stroke="#8F8A7E" stroke-width="2"/></g><text x="32.0" y="728.7" font-fami