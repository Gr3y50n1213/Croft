"12.0" y="278.0" width="276.0" height="92.0" rx="20" fill="#FFFFFF" stroke="#CBC4B5" stroke-width="1.2"/><circle cx="36.0" cy="306.0" r="10" fill="none" stroke="#6C706A" stroke-width="2"/><text x="58.0" y="310.9" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E2220">Google push</text><text x="58.0" y="332.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#6C706A">Instant, through Croft’s open gateway.</text><text x="58.0" y="346.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#6C706A">Only a wake-up ping is sent, never mail.</text><rect x="12.0" y="380.0" width="276.0" height="92.0" rx="20" fill="#FFFFFF" stroke="#CBC4B5" stroke-width="1.2"/><circle cx="36.0" cy="408.0" r="10" fill="none" stroke="#6C706A" stroke-width="2"/><text x="58.0" y="412.9" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1E2220">Check regularly</text><text x="58.0" y="434.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#6C706A">Every 15 minutes. No setup, but not</text><text x="58.0" y="448.0" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="400" fill="#6C706A">instant.</text><circle cx="36.0" cy="508.0" r="18" fill="#DDE9DD"/><g transform="translate(26.5,498.5) scale(0.7917)" fill="none" stroke="#2F4A33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17v-6a6 6 0 0112 0v6l1.5 2h-15zM10 21h4"/></g><text x="68.0" y="512.9" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#1E2220">Notifications allowed</text><g transform="translate(257.0,499.0) scale(0.7500)" fill="none" stroke="#4F6F52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><rect x="20.0" y="546.0" width="120.0" height="40.0" rx="20.0" 