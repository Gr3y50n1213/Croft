/><text x="623.4" y="553.4" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">up to three drafts docked</text></g><rect width="1100" height="600" rx="12" fill="none" stroke="#8F8A7E" stroke-width="2"/></g><text x="32.0" y="708.7" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F4A33">W02</text><text x="69.9" y="708.7" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#1E2220">Conversation and compose</text><text x="32.0" y="728.1" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6C706A">The rail collapses on narrow windows. Compose floats at the bottom right so the conversation stays visible; it can be minimised, and up to three drafts dock along the bottom.</text><text x="28.0" y="759.6" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-size="10" font-weight="400" fill="#6C706A">Croft wireframes · green = primary action · wax red = destructive · amber = star and snooze · blue = read state · wax tags = behaviour notes</text></svg>