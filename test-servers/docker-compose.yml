# Mail servers the integration tests run against.
#
#   docker compose -f test-servers/docker-compose.yml up -d greenmail dovecot
#   cd core && cargo test -p croft-protocols --features integration
#   docker compose -f test-servers/docker-compose.yml down
#
# Everything here is for tests on localhost only. The users and passwords are throwaway values.
# Image tags are pinned; bump them on purpose, not by accident.
services:
  # GreenMail: a Java test server. IMAP 3143 (plain, localhost only), IMAPS 3993 (self-signed,
  # certificate changes on every start, so tests pin the fingerprint they read with
  # probe_certificate). Users are created at start: login test / password test, and alice / alice.
  greenmail:
    image: greenmail/standalone:2.1.15
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:test@localhost,alice:alice@localhost
    ports:
      - "127.0.0.1:${CROFT_GREENMAIL_SMTP_PORT:-3025}:3025"   # SMTP
      - "127.0.0.1:${CROFT_GREENMAIL_IMAP_PORT:-3143}:3143"   # IMAP
      - "127.0.0.1:${CROFT_GREENMAIL_IMAPS_PORT:-3993}:3993"   # IMAPS
      - "127.0.0.1:${CROFT_GREENMAIL_SMTPS_PORT:-3465}:3465"   # SMTPS

  # Dovecot 2.4 (the official image): MOVE, UIDPLUS, SPECIAL-USE, CONDSTORE and QRESYNC. Its
  # example config accepts ANY user name with the one password in USER_PASSWORD, and creates the
  # mailbox on first login. IMAP 31143 (STARTTLS required for login) and IMAPS 31993 both use the
  # throwaway self-signed certificate in test-servers/dovecot/ssl (CN=localhost, test only).
  dovecot:
    image: dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: "{PLAIN}testpass"
    ports:
      - "127.0.0.1:31143:31143"
      - "127.0.0.1:31993:31993"
    volumes:
      - ./dovecot/conf.d/90-test.conf:/etc/dovecot/conf.d/90-test.conf:ro
      - ./dovecot/ssl/tls.crt:/etc/dovecot/ssl/tls.crt:ro
      - ./dovecot/ssl/tls.key:/etc/dovecot/ssl/tls.key:ro

  # Stalwart 1.1.0 (JMAP, IMAP, SMTP in one). It starts in "bootstrap mode" with an empty
  # configuration, so the container alone has no users: run `stalwart/setup.sh` after it is up. That
  # script completes the bootstrap and creates two users (alice@example.org and bob@example.org,
  # throwaway passwords printed in the script). JMAP over plain HTTP on 8080 (tests only: the JMAP
  # adapter allows plaintext for loopback hosts only) and over HTTPS on 8443 (self-signed
  # certificate, so tests pin its fingerprint). Host ports come from the variables below, so a second
  # copy can run next to another one:
  #   CROFT_STALWART_HTTP_PORT=18080 CROFT_STALWART_HTTPS_PORT=18443 \
  #     docker compose -p croft-t09 -f test-servers/docker-compose.yml up -d --wait stalwart
  #   test-servers/stalwart/setup.sh 18080
  #   (then the tests: CROFT_TEST_STALWART_HTTP_PORT=18080 CROFT_TEST_STALWART_HTTPS_PORT=18443 ...)
  stalwart:
    image: stalwartlabs/stalwart:v1.1.0
    environment:
      # Pins the temporary administrator of bootstrap mode (otherwise a random password is printed once
      # in the log). Throwaway value, localhost only.
      STALWART_RECOVERY_ADMIN: "admin:croft-recovery-admin-4d1f9c"
    ports:
      - "127.0.0.1:${CROFT_STALWART_HTTP_PORT:-8080}:8080"    # JMAP and admin API over plain HTTP
      - "127.0.0.1:${CROFT_STALWART_HTTPS_PORT:-8443}:443"    # JMAP over HTTPS (self-signed)
      - "127.0.0.1:${CROFT_STALWART_IMAPS_PORT:-1993}:993"    # IMAPS (self-signed)
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart

  radicale:
    image: tomsquest/docker-radicale:latest
    ports: ["5232:5232"]                                      # CalDAV and CardDAV
    volumes: ["radicale-data:/data"]

volumes:
  stalwart-etc:
  stalwart-data:
  radicale-data:
