# Test-only overrides for the dovecot service in docker-compose.yml.
# Listen on IPv4 only: some container hosts (including CI sandboxes) have no IPv6, and Dovecot
# refuses to start when it cannot open the default "*, ::" listeners.
listen = *
# Answer failed logins at once. With the default (2 secs) every "wrong password" reply is delayed,
# and when the wrong-password tests ran again against the same container they failed with network
# errors (seen with T03's dovecot_wrong_password_is_auth). Test servers have no reason to slow down
# guessing.
auth_failure_delay = 0
