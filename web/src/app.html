<html lang="en" data-croft-theme="moss" data-croft-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Croft</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#4F6F52" />
    <!-- Light or dark before the first paint (a file: the page's CSP allows no inline script but SvelteKit's). -->
    <script src="%sveltekit.assets%/theme.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div class="app-root">%sveltekit.body%</div>
  </body>
</html>
